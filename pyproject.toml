[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hivemind-ma-player"
version = "0.1.0"
description = "HiveMind remote OVOS player provider for Music Assistant"
requires-python = ">=3.11"
dependencies = [
    "music-assistant-plugin-manager",
    "ovos-bus-client>=2.9.1a1",
    "hivemind-bus-client>=1.0.16a1",
    "ovos-utils>=0.8.5",
    "ovos-pydantic-models>=0.3.0a1",
]

[project.entry-points."music_assistant.provider"]
hivemind_player = "hivemind_ma_player"

[tool.setuptools.packages.find]
include = ["hivemind_ma_player*"]

[tool.setuptools.package-data]
hivemind_ma_player = ["manifest.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"

[project.optional-dependencies]
test = ["pytest", "pytest-asyncio", "ovos-pydantic-models"]
